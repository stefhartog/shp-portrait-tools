<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHP PhotoCraft Tools</title>
<link rel="stylesheet" href="static/shp-ui.css">
<script src="static/theme.js"></script>
<link rel="stylesheet" href="static/shell.css">
<script src="static/shell.js" defer></script>
<script src="static/lifecycle.js" defer></script>
</head>
<body>
<header class="shell-header">
  <nav aria-label="Modules" role="tablist">
    <button id="tab-mask" role="tab" aria-selected="false" aria-controls="panel-dnb" aria-busy="true" aria-label="Skin Mask: Starting" title="Starting" data-service="dnb" data-view="mask" tabindex="-1">Skin Mask</button>
    <button id="tab-frequency" role="tab" aria-selected="false" aria-controls="panel-dnb" aria-busy="true" aria-label="FS + Skintone: Starting" title="Starting" data-service="dnb" data-view="frequency" tabindex="-1">FS + Skintone</button>
    <button id="tab-dnb" role="tab" aria-selected="false" aria-controls="panel-dnb" aria-busy="true" aria-label="D&amp;B: Starting" title="Starting" data-service="dnb" data-view="dnb" tabindex="-1">D&amp;B</button>
    <button id="tab-combine" role="tab" aria-selected="false" aria-controls="panel-dnb" aria-busy="true" aria-label="Combine: Starting" title="Starting" data-service="dnb" data-view="combine" tabindex="-1">Combine</button>
    <button id="tab-crop" role="tab" aria-selected="true" aria-controls="panel-crop" aria-busy="true" aria-label="Crop: Starting" title="Starting" data-service="crop" data-view="crop">Crop</button>
  </nav>
</header>
<div id="status" role="status" aria-live="polite"></div>
<main id="workspace">
  <section id="panel-crop" class="module-panel" role="tabpanel" aria-labelledby="tab-crop">
    <div class="placeholder">Starting Crop. Use the Tools tray menu for service controls.</div>
  </section>
  <section id="panel-dnb" class="module-panel inactive" role="tabpanel" aria-labelledby="tab-dnb" aria-hidden="true" inert>
    <div class="placeholder">Starting D&amp;B. Use the Tools tray menu for service controls.</div>
  </section>
</main>
</body>
</html>
