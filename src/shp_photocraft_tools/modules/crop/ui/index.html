<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SHP PhotoCraft Crop</title>
<link rel="stylesheet" href="static/shp-ui.css">
<script src="static/theme.js"></script>
<script src="static/lifecycle.js" defer></script>
<style>
  #app { display:grid; grid-template-columns: 380px 1fr; grid-template-rows: auto minmax(0, 1fr); height:100vh; }
  #bar { grid-column: 1 / -1; }
  #bar b.brand { color:var(--text); font-size:14px; }
  select { max-width:260px; }
  #xRun.cancel { background:#b3363b; border-color:#b3363b; color:#fff; }
  .crop-section { border-top:1px solid var(--line); }
  .crop-section:first-child { border-top:0; }
  .crop-section h2, .crop-section > summary { margin:0; padding:12px 0 8px; font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--heading); font-weight:600; }
  .crop-section > summary { display:block; list-style:none; cursor:pointer; user-select:none; }
  .crop-section > summary::-webkit-details-marker { display:none; }
  .crop-section > summary:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  #xGenerate { display:flex; align-items:center; gap:4px; margin:0 0 6px; }
  #xVariations { display:flex; flex:1; min-width:0; gap:4px; }
  #xVariations button { flex:1; min-width:0; padding:6px 2px; font-weight:600; }
  #xVariations button.on { background:var(--acc); border-color:var(--acc); color:var(--primary-text); }
  #xAdv .toggle-row { padding:2px 0; }
  #xAdv .toggle-row > label { width:auto; flex:1; }
  #xAdv .toggle-row > input { margin:0; }
  #xAdv .toggle-row + .toggle-row { margin-top:6px; }
  #xAdv .model-row { padding:4px 0; }
  #xAdv .row[hidden] { display:none; }
  .ratios { display:grid; grid-template-columns:repeat(6, 1fr); gap:4px; margin:6px 0; }
  .ratios button, .seg button { padding:5px 2px; font-size:12px; white-space:nowrap; }
  .ratios button.on, .seg button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .seg { display:flex; gap:4px; margin:6px 0; } .seg button { flex:1; }
  #xPrompt { width:100%; min-height:54px; resize:vertical; background:var(--input); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 6px; font:inherit; }
  main { display:flex; flex-direction:column; min-width:0; min-height:0; padding:6px; }
  #xStage { position:relative; flex:1; min-height:0; background:var(--workspace); border:1px solid var(--line); border-top:0; overflow:hidden; }
  #xCanvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; }
  #xInfo { color:var(--dim); font-size:12px; margin:8px 0 20px; padding-inline:clamp(16px, 10%, 40px); }
  .crop-resolution, .crop-shifts { display:grid; grid-template-columns:minmax(0, 1fr) auto minmax(0, 1fr); gap:4px; }
  .crop-resolution > span { min-width:0; overflow-wrap:anywhere; }
  .crop-resolution > :nth-child(2) { text-align:center; }
  .crop-resolution > :last-child { text-align:right; }
  .crop-shifts { grid-template-areas:". top ." "left . right" ". bottom ."; margin-top:16px; padding-inline:60px; }
  .crop-shifts > span { min-width:0; overflow-wrap:anywhere; }
  .crop-shifts > [data-side="top"] { grid-area:top; text-align:center; }
  .crop-shifts > [data-side="left"] { grid-area:left; }
  .crop-shifts > [data-side="right"] { grid-area:right; text-align:right; }
  .crop-shifts > [data-side="bottom"] { grid-area:bottom; text-align:center; }
  @media (max-width: 980px) {
    #app { grid-template-columns: 1fr; grid-template-rows: none; height:auto; }
    aside { border-right:0; border-bottom:1px solid var(--line); overflow:visible; }
    main { min-height: 100vh; }
  }
</style>
</head>
<body>
<div id="app">
<div id="bar"><button class="workflow" id="xGet" title="Take the active document in PhotoCraft (merged) to expand.">Get Image</button><button class="workflow" id="xSend" title="Grow the canvas of that document and add the generated area as a layer, as one undo step." disabled>Send Result</button><div id="statusWrap"><div id="status"></div></div><select id="xFiles" title="Open a picture from the --dir folders." hidden></select><span id="presetBar" style="margin-left:auto;display:flex;gap:6px;align-items:center"><select id="presetSel" title="Choose a saved set of Advanced settings. A star means the current settings differ from it."></select><button id="presetSave" title="Overwrite the selected preset with the current settings.">Save</button><button id="presetNew" title="Store the current settings as a new preset (asks for a name).">Save New</button><button id="presetRemove" title="Delete the selected preset.">Delete</button></span></div>
<aside>
  <section class="crop-section">
    <h2>Crop</h2>
    <div class="gbody">
      <div class="ratios" id="xRatios"></div>
      <div id="xInfo"></div>
      <div id="xGenerate"><button class="primary" id="xRun" disabled title="Generate the new area with ComfyUI. The picture itself is not changed.">Generate</button><div id="xVariations" role="group" aria-label="Number of variations"><button data-count="1" class="on" aria-pressed="true">1</button><button data-count="2" aria-pressed="false">2</button><button data-count="3" aria-pressed="false">3</button></div></div>
      <div id="xVariationNote" class="hint" hidden></div>
    </div>
  </section>
  <details class="crop-section" open>
    <summary>AI SETTINGS</summary>
    <div class="gbody">
      <div id="xAdv"></div>
      <textarea id="xPrompt" placeholder="Optional: describe what the new area should show. Empty continues the scene." title="Optional prompt for the new area. Empty = continue the scene."></textarea>
      <button id="xFreeMemory" title="Request model unload and memory cleanup only while Comfy is idle. The next generation reloads models; not all RAM/VRAM can be freed while Comfy is running.">Free Comfy memory</button>
    </div>
  </details>
</aside>
<main>
  <div class="tabs pane-header"><button class="tab on" id="xTabFrame" title="Place the frame">Frame</button><span id="xResTabs" style="display:contents"></span></div>
  <div id="xStage"><canvas id="xCanvas"></canvas></div>
</main>
</div>

<script>
const $ = (id) => document.getElementById(id);
async function api(path, body) {
  const r = await fetch(path.replace(/^\//, ''), body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
let busy = false;
function setBusy(b) { busy = b; $('status').classList.toggle('busy', b); }
function setStatus(msg, err=false, ok=false) { const s=$('status'); s.textContent = msg; s.className = err ? 'err' : busy ? 'busy' : ok ? 'ok' : ''; }

const X = {ready:false, img:null, el:null, resEl:null, W:0, H:0, ratio:[4,3], land:true, fx:0, fy:0, fw:0, view:'frame', free:false, fh:0, aspect:1, running:false, hasResult:false, hasDoc:false, limit:999, seq:0, v:null, drag:null};
const BASE_RATIOS = [[1,1],[4,3],[3,2],[16,9],[5,4]];
function xRatio() { if (X.free) return [X.aspect, 1]; const [a,b] = X.ratio; return X.land ? [a,b] : [b,a]; }
function fH() { return X.free ? X.fh : xH(X.fw); }
const KEEP = 64;  // min picture px kept per axis (MIN_SIDE in expand.py)
const SNAP = 2;  // a ratio frame within this many px of the picture's side uses that side exactly (no 1 px strips from rounding)
function xH(w) { const [a,b] = xRatio(), h = Math.round(w*b/a); return X.img && Math.abs(h - X.H) <= SNAP ? X.H : h; }
function xBase() { const [a,b] = xRatio(), w = Math.ceil(X.H*a/b); return w - X.W <= SNAP ? X.W : w; }  // smallest frame that contains the picture = 100%
function xWmin() { const [a,b] = xRatio(); return Math.min(xWmax(), Math.max(Math.ceil(xBase()/2), Math.ceil(64*Math.max(1, a/b)))); }
function xWmax() { const [a,b] = xRatio(); return Math.min(X.W + 2*X.limit, Math.floor((X.H + 2*X.limit)*a/b)); }
function xSizeMax() { return Math.min(xWmax(), Math.round(xBase()*1.5)); }
const xFreeMax = ext => Math.max(ext, Math.min(Math.round(1.5*ext), ext + 2*X.limit));
const xFreeMin = ext => Math.max(64, Math.ceil(ext/2));
function xClamp() {
  if (X.free) { X.fw = Math.min(xFreeMax(X.W), Math.max(xFreeMin(X.W), Math.round(X.fw))); X.fh = Math.min(xFreeMax(X.H), Math.max(xFreeMin(X.H), Math.round(X.fh))); }
  else { X.fw = Math.min(xWmax(), Math.max(xWmin(), Math.round(X.fw))); if (Math.abs(X.fw - X.W) <= SNAP && X.W <= xWmax()) X.fw = X.W; }
  const h = fH();
  // each side crops or adds (at most `limit` px) on its own; at least KEEP px of the picture stays in the frame
  const lim = (extent, size, v) => {
    const lo = Math.max(-X.limit, KEEP - size), hi = Math.min(extent + X.limit - size, extent - KEEP);
    return Math.round(Math.min(hi, Math.max(lo, v)));
  };
  X.fx = lim(X.W, X.fw, X.fx); X.fy = lim(X.H, h, X.fy);
}
function xCentre() { X.fx = -Math.floor((X.fw - X.W)/2); X.fy = -Math.floor((fH() - X.H)/2); xClamp(); }
function xResetFrame(w) { if (X.free) { X.fw = X.W; X.fh = X.H; X.aspect = X.W/X.H; } else X.fw = w || xBase(); xCentre(); }
function xMargins() { const h = fH(); return [-X.fx, -X.fy, X.fx + X.fw - X.W, X.fy + h - X.H]; }
function xSyncSize() {}
function xInfo() {
  const [l,t,r,b] = X.img ? xMargins() : [0,0,0,0], h = X.img ? fH() : 0, [a,bb] = xRatio();
  const width = X.img ? X.W : 0, height = X.img ? X.H : 0, newWidth = X.img ? X.fw : 0;
  const added = Math.max(l, t, r, b) > 0, sg = v => v > 0 ? '+' + v : v < 0 ? '\u2212' + (-v) : '0';
  const shift = (side, value) => `<span data-side="${side}" title="${side} shift: ${sg(value)} px" aria-label="${side} shift: ${sg(value)} pixels">${sg(value)}</span>`;
  $('xInfo').innerHTML = `<div class="crop-resolution"><span title="Original resolution">${width} \u00d7 ${height}</span><span aria-label="to">\u2192</span><span title="New resolution (${X.free ? 'free' : a + ':' + bb})">${newWidth} \u00d7 ${h}</span></div><div class="crop-shifts">${shift('top', t)}${shift('left', l)}${shift('right', r)}${shift('bottom', b)}</div>` + (!X.img || added ? '' : '<div>Nothing to generate: drag a corner outwards to add space.</div>');
  if (!X.running) $('xRun').disabled = !X.img || !added || !X.ready || X.settingsSaving || busy;
}
function xButtons() {
  document.querySelectorAll('#xRatios button[data-i]').forEach(b => b.classList.toggle('on', !X.free && b.dataset.i === String(BASE_RATIOS.findIndex(r => r[0]===X.ratio[0] && r[1]===X.ratio[1])))); $('xFree').classList.toggle('on', X.free);
  document.querySelectorAll('#xRatios button[data-i]').forEach(b => { const [a,c] = BASE_RATIOS[+b.dataset.i]; b.textContent = X.land || a === c ? `${a}:${c}` : `${c}:${a}`; });
  $('xSend').disabled = !(X.hasResult && X.sourceKind) || X.running || busy;
  $('xGet').disabled = X.running || busy; $('xFiles').disabled = X.running || busy; document.querySelectorAll('#xVariations button').forEach(e => e.disabled = X.running || busy); document.querySelectorAll('#xAdv input,#xAdv select').forEach(e => e.disabled = X.running || busy || X.settingsSaving);
  $('xFreeMemory').disabled = X.running || busy || X.settingsSaving;
}
BASE_RATIOS.forEach((r, i) => { const b = document.createElement('button'); b.dataset.i = i; b.title = 'Click again to flip it (landscape / portrait).';
  b.onclick = () => { if (!X.free && X.ratio === r) { xSetOrientation(!X.land); return; } X.free = false; X.ratio = r; if (X.img) xResetFrame(); xRefresh(true); }; $('xRatios').append(b); });
{ const b = document.createElement('button'); b.id = 'xFree'; b.textContent = 'Free'; b.title = 'No fixed ratio: drag the corners freely. Click again to swap width and height.';
  b.onclick = () => { if (X.free) { if (X.img) xSetOrientation(!(X.fw >= X.fh)); return; } X.fh = fH(); X.free = true; X.aspect = X.img ? X.fw/X.fh : 1; if (X.img) xClamp(); xRefresh(true); }; $('xRatios').append(b); }
function xRefresh(fit) { xButtons(); xSyncSize(); xInfo(); if (fit) xFit(); xDraw(); }
function xSetOrientation(land) {
  if (X.free) { if (X.img && (X.fw >= X.fh) !== land) { const cx = X.fx + X.fw/2, cy = X.fy + X.fh/2; [X.fw, X.fh] = [X.fh, X.fw]; X.aspect = X.fw/X.fh; X.fx = Math.round(cx - X.fw/2); X.fy = Math.round(cy - X.fh/2); xClamp(); } X.land = land; xRefresh(true); return; }
  X.land = land; if (X.img) xResetFrame(); localStorage.setItem('shpx-land', land ? '1' : '0'); xRefresh(true); }
let variations = 1;
function setVariations(value, persist=false) {
  const count = Number(value);
  variations = Number.isInteger(count) && count >= 1 && count <= 4 ? count : 1;
  document.querySelectorAll('#xVariations button').forEach(button => {
    const selected = +button.dataset.count === variations;
    button.classList.toggle('on', selected); button.setAttribute('aria-pressed', String(selected));
  });
  $('xVariationNote').hidden = variations <= 3;
  $('xVariationNote').textContent = variations > 3 ? 'Saved selection: 4 variations. Choose 1, 2 or 3 to change.' : '';
  if (persist) localStorage.setItem('shpx-var', String(variations));
}
document.querySelectorAll('#xVariations button').forEach(button => button.onclick = () => {
  if (!X.running) setVariations(button.dataset.count, true);
});
setVariations(localStorage.getItem('shpx-var') || 1);

/* view: image px -> canvas px. Fixed per picture/ratio: fits the picture plus the largest (150%) frame centred on it,
   so changing the size never zooms. Only if the frame is moved outside that box does the view grow to keep it in sight. */
function xFit() {
  const c = $('xCanvas'), r = c.getBoundingClientRect(); if (!X.img || !r.width) return;
  const mw = X.free ? xFreeMax(X.W) : xSizeMax(), mh = X.free ? xFreeMax(X.H) : xH(mw), mx = -(mw - X.W)/2, my = -(mh - X.H)/2;
  const x0 = Math.min(0, mx, X.fx), y0 = Math.min(0, my, X.fy);
  const x1 = Math.max(X.W, mx + mw, X.fx + X.fw), y1 = Math.max(X.H, my + mh, X.fy + fH());
  const pad = 28, k = Math.min((r.width - 2*pad)/(x1 - x0), (r.height - 2*pad)/(y1 - y0));
  X.v = {k, ox: r.width/2 - (x0 + x1)/2*k, oy: r.height/2 - (y0 + y1)/2*k};
}
const xp = (x, y) => [X.v.ox + x*X.v.k, X.v.oy + y*X.v.k];
function xDraw() {
  const c = $('xCanvas'), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  c.width = Math.round(r.width*dpr); c.height = Math.round(r.height*dpr);
  const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, r.width, r.height);
  if (!X.img || !X.v) { g.fillStyle = '#9aa1b0'; g.font = '13px system-ui'; g.textAlign = 'center'; g.fillText('no picture yet', r.width/2, r.height/2); return; }
  const h = fH(), [fx, fy] = xp(X.fx, X.fy), fw = X.fw*X.v.k, fh = h*X.v.k, [ix, iy] = xp(0, 0), iw = X.W*X.v.k, ih = X.H*X.v.k;
  if (X.view === 'result' && X.resEl) {
    // result view: own zoom/pan (wheel zooms at the mouse, drag pans, double-click fits)
    const rw = X.resEl.naturalWidth, rh = X.resEl.naturalHeight;
    if (!X.rv) { const k = Math.min((r.width - 48)/rw, (r.height - 48)/rh); X.rv = {k, ox: (r.width - rw*k)/2, oy: (r.height - rh*k)/2}; }
    g.imageSmoothingQuality = 'high'; g.drawImage(X.resEl, X.rv.ox, X.rv.oy, rw*X.rv.k, rh*X.rv.k);
    return;
  }
  g.fillStyle = 'rgba(76,141,255,.10)'; g.fillRect(fx, fy, fw, fh);
  g.save(); g.beginPath(); g.rect(fx, fy, fw, fh); g.clip(); g.strokeStyle = 'rgba(76,141,255,.25)'; g.lineWidth = 1;
  for (let d = -fh; d < fw; d += 12) { g.beginPath(); g.moveTo(fx + d, fy + fh); g.lineTo(fx + d + fh, fy); g.stroke(); } g.restore();
  g.drawImage(X.el, ix, iy, iw, ih);
  // darken the part of the picture that the frame crops off
  g.save(); g.beginPath(); g.rect(ix, iy, iw, ih); g.rect(fx, fy, fw, fh); g.clip('evenodd');
  g.fillStyle = 'rgba(0,0,0,.6)'; g.fillRect(ix, iy, iw, ih); g.restore();
  g.strokeStyle = '#4c8dff'; g.lineWidth = 2; g.strokeRect(fx, fy, fw, fh);
  g.lineWidth = 1; g.strokeStyle = 'rgba(255,255,255,.25)';
  for (let i = 1; i < 3; i++) { g.beginPath(); g.moveTo(fx + fw*i/3, fy); g.lineTo(fx + fw*i/3, fy + fh); g.moveTo(fx, fy + fh*i/3); g.lineTo(fx + fw, fy + fh*i/3); g.stroke(); }
  g.fillStyle = '#4c8dff';
  xCorners().forEach(([cx, cy], i) => i < 4 ? g.fillRect(cx - 5, cy - 5, 10, 10) : i % 2 ? g.fillRect(cx - 3, cy - 8, 6, 16) : g.fillRect(cx - 8, cy - 3, 16, 6));
}
function xCorners() { const h = fH(), x0 = X.fx, y0 = X.fy, x1 = X.fx + X.fw, y1 = X.fy + h, xm = (x0 + x1)/2, ym = (y0 + y1)/2;
  return [[x0, y0], [x1, y0], [x0, y1], [x1, y1], [xm, y0], [x1, ym], [xm, y1], [x0, ym]].map(([x, y]) => xp(x, y)); }
const HCURSOR = ['nwse-resize', 'nesw-resize', 'nesw-resize', 'nwse-resize', 'ns-resize', 'ew-resize', 'ns-resize', 'ew-resize'];
function xPointer(e) { const r = $('xCanvas').getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function xToImg(px, py) { return [(px - X.v.ox)/X.v.k, (py - X.v.oy)/X.v.k]; }
$('xCanvas').addEventListener('wheel', e => {
  if (X.view !== 'result' || !X.rv) return;
  e.preventDefault();
  const [px, py] = xPointer(e), f = Math.exp(-e.deltaY*0.0015), k = Math.min(16, Math.max(0.02, X.rv.k*f)), s = k/X.rv.k;
  X.rv = {k, ox: px - (px - X.rv.ox)*s, oy: py - (py - X.rv.oy)*s}; xDraw();

$('xCanvas').addEventListener('dblclick', () => { if (X.view === 'result') { X.rv = null; xDraw(); } });
$('xCanvas').addEventListener('pointerdown', e => {
  if (X.view === 'result' && X.rv) { const [px, py] = xPointer(e); X.drag = {kind:'pan', px, py, ox:X.rv.ox, oy:X.rv.oy}; $('xCanvas').setPointerCapture(e.pointerId); $('xCanvas').style.cursor = 'grabbing'; return; }
  if (!X.img || X.running || X.view !== 'frame') return;
  const [px, py] = xPointer(e), cs = xCorners();
  const ci = cs.findIndex(([cx, cy]) => Math.abs(cx - px) < 12 && Math.abs(cy - py) < 12);
  const [ix, iy] = xToImg(px, py), h = fH();
  if (ci >= 0) {
    if (ci >= 4) X.drag = {kind:'edge', ci, opp: [X.fy + h, X.fx, X.fy, X.fx + X.fw][ci - 4], cx: X.fx + X.fw/2, cy: X.fy + h/2};
    else X.drag = {kind:'size', ci, opp: [[X.fx + X.fw, X.fy + h], [X.fx, X.fy + h], [X.fx + X.fw, X.fy], [X.fx, X.fy]][ci]};
  } else if (ix >= X.fx && ix <= X.fx + X.fw && iy >= X.fy && iy <= X.fy + h) X.drag = {kind:'move', ix, iy, fx:X.fx, fy:X.fy};
  else return;
  $('xCanvas').setPointerCapture(e.pointerId);
});
$('xCanvas').addEventListener('pointermove', e => {
  const [px, py] = xPointer(e);
  if (X.drag && X.drag.kind === 'pan') { X.rv.ox = X.drag.ox + px - X.drag.px; X.rv.oy = X.drag.oy + py - X.drag.py; xDraw(); return; }
  if (!X.drag) {
    if (X.view === 'result') { $('xCanvas').style.cursor = X.rv ? 'grab' : 'default'; return; }
    const ci = X.img && X.view === 'frame' && !X.running ? xCorners().findIndex(([cx, cy]) => Math.abs(cx - px) < 12 && Math.abs(cy - py) < 12) : -1;
    $('xCanvas').style.cursor = ci >= 0 ? HCURSOR[ci] : X.img && X.view === 'frame' ? 'move' : 'default'; return;
  }
  const [ix, iy] = xToImg(px, py);
  // size range along one axis that keeps the opposite edge `o` fixed (dragged edge within the limit, KEEP px of picture)
  const rng = (o, ext, fwd) => fwd ? [KEEP - o, ext + X.limit - o] : [o - ext + KEEP, o + X.limit];
  if (X.drag.kind === 'move') { X.fx = Math.round(X.drag.fx + ix - X.drag.ix); X.fy = Math.round(X.drag.fy + iy - X.drag.iy); xClamp(); }
  else if (X.drag.kind === 'edge') {
    // one side moves, the opposite side stays; with a ratio the other dimension follows around its centre
    const o = X.drag.opp, horiz = X.drag.ci % 2 === 1, fwd = X.drag.ci === 5 || X.drag.ci === 6, [a, b] = xRatio();
    const [lo, hi] = rng(o, horiz ? X.W : X.H, fwd), want = Math.round(Math.abs((horiz ? ix : iy) - o));
    if (horiz) {
      X.fw = X.free ? Math.min(xFreeMax(X.W), hi, Math.max(xFreeMin(X.W), lo, want))
                    : Math.min(xSizeMax(), hi, Math.max(xWmin(), lo, want));
      if (X.free) X.aspect = X.fw/X.fh; else X.fy = Math.round(X.drag.cy - xH(X.fw)/2);
      X.fx = Math.round(fwd ? o : o - X.fw);
    } else {
      if (X.free) { X.fh = Math.min(xFreeMax(X.H), hi, Math.max(xFreeMin(X.H), lo, want)); X.aspect = X.fw/X.fh; }
      else { X.fw = Math.min(xSizeMax(), Math.floor(hi*a/b), Math.max(xWmin(), Math.ceil(lo*a/b), Math.round(want*a/b))); X.fx = Math.round(X.drag.cx - X.fw/2); }
      X.fy = Math.round(fwd ? o : o - fH());
    }
    xClamp();
  }
  else {
    const [ox, oy] = X.drag.opp, [a, b] = xRatio(), right = X.drag.ci % 2 === 1, bottom = X.drag.ci >= 2;
    const [xlo, xhi] = rng(ox, X.W, right), [ylo, yhi] = rng(oy, X.H, bottom);
    if (X.free) {
      X.fw = Math.min(xFreeMax(X.W), xhi, Math.max(xFreeMin(X.W), xlo, Math.round(Math.abs(ix - ox))));
      X.fh = Math.min(xFreeMax(X.H), yhi, Math.max(xFreeMin(X.H), ylo, Math.round(Math.abs(iy - oy)))); X.aspect = X.fw/X.fh;
      X.fx = Math.round(right ? ox : ox - X.fw); X.fy = Math.round(bottom ? oy : oy - X.fh); xClamp();
      xButtons(); xSyncSize(); xInfo(); xDraw(); return;
    }
    X.fw = Math.round(Math.max(Math.abs(ix - ox), Math.abs(iy - oy)*a/b));
    X.fw = Math.min(xSizeMax(), xhi, Math.floor(yhi*a/b), Math.max(xWmin(), xlo, Math.ceil(ylo*a/b), X.fw)); const h = xH(X.fw);
    X.fx = Math.round(right ? ox : ox - X.fw); X.fy = Math.round(bottom ? oy : oy - h);
    xClamp();
  }
  xButtons(); xSyncSize(); xInfo(); xDraw();
});
const xEnd = () => { if (X.drag) { const pan = X.drag.kind === 'pan'; X.drag = null; if (pan) $('xCanvas').style.cursor = 'grab'; else xRefresh(true); } };
$('xCanvas').addEventListener('pointerup', xEnd); $('xCanvas').addEventListener('pointercancel', xEnd);
window.addEventListener('resize', () => { xFit(); X.rv = null; xDraw(); });

function xLoaded(r) {
  X.W = r.width; X.H = r.height; X.limit = Math.min(999, r.limit); X.seq = r.seq; X.hasResult = false; xClearTabs(); X.resEl = null; X.hasDoc = !!r.pc_doc; X.view = 'frame';
  X.sourceKind = r.source_kind || (r.pc_doc ? 'photocraft' : 'local'); xTransferTitles();
  X.land = X.W >= X.H; localStorage.setItem('shpx-land', X.land ? '1' : '0');
  const el = new Image(); el.onload = () => { X.img = true; X.el = el; xResetFrame(); xTab('frame'); xRefresh(true); };
  el.src = 'img/xorig?' + r.seq;
  setStatus(`${r.name}: ${r.width} \u00d7 ${r.height}.`, false, true);
}
function xTab(v) {
  X.view = v; $('xTabFrame').classList.toggle('on', v === 'frame');
  [...$('xResTabs').children].forEach((b, i) => b.classList.toggle('on', v === 'result' && i === X.sel)); xDraw();
}
$('xTabFrame').onclick = () => xTab('frame');
function xClearTabs() { $('xResTabs').innerHTML = ''; X.sel = 0; X.vars = []; X.rv = null; X.pickRequest = (X.pickRequest || 0) + 1; }
function xMakeTabs(n) {
  const box = $('xResTabs');
  for (let i = X.vars.length; i < n; i++) {
    const b = document.createElement('button'); b.className = 'tab'; b.textContent = n > 1 ? `Result ${i + 1}` : 'Result';
    b.title = 'Show this result. The result shown here is the one Send Result and Save use.';
    b.onclick = () => xPick(i); box.append(b); X.vars.push(null);
  }
  [...box.children].forEach((b, i) => { b.textContent = n > 1 ? `Result ${i + 1}` : 'Result'; b.classList.toggle('on', X.view === 'result' && i === X.sel); });
}
async function xPick(i, announce = true) {
  if (X.transferring) return;
  const request = X.pickRequest = (X.pickRequest || 0) + 1;
  if (i !== X.sel || !X.resEl) { try { await api('/api/select', {index:i}); } catch (e) { setStatus(e.message, true); return; } }
  if (request !== X.pickRequest) return;
  const el = new Image(); el.onload = () => {
    if (request !== X.pickRequest) return;
    X.sel = i; X.resEl = el; X.hasResult = true; xTab('result'); xRefresh(false);
    if (!X.running && announce) {
      const n = X.vars.length; setStatus(n > 1 ? `Result ${i + 1} of ${n} selected: Send Result uses this one.` : X.sourceKind === 'local' ? 'Generated. Use Send Result to save beside the source.' : 'Generated. Use Send Result to send it to PhotoCraft.', false, true);
    }
  };
  el.onerror = () => { if (request === X.pickRequest) setStatus('Could not load the generated preview. Select its result tab to retry.', true); };
  el.src = `img/xvar${i}?` + Date.now();
}
async function xGet() {
  if (X.running || busy) return;
  xTransferBusy(true);
  try {
    const connection = await api('/api/pc/status', {});
    X.pcConnected = connection.connected; xTransferTitles();
    let path = null;
    if (!connection.connected) {
      if (!window.__shpNativeFileDialog) throw new Error('Local Open needs the Tools desktop window. In a standalone browser, use the --dir file list; Send Result then saves beside that source.');
      path = window.prompt('SHP_OPEN_IMAGE_V1');
      if (!path) return;
    }
    setStatus(path ? 'Opening local picture...' : 'Getting the picture from PhotoCraft...');
    xLoaded(await api(path ? '/api/load' : '/api/fetch', path ? {path} : {}));
  } catch (e) { setStatus(e.message, true); }
  finally { xTransferBusy(false); }
}
function xTransferBusy(value) { X.transferring = value; setBusy(value); xButtons(); xInfo(); }
function xTransferTitles() {
  $('xGet').title = X.pcConnected === false ? 'Open a local image (Tools desktop native file chooser).' : 'Get the active PhotoCraft document; if disconnected, open a local image in the Tools desktop.';
  $('xSend').title = X.sourceKind === 'local' ? 'Save the selected full-resolution result as a numbered PNG beside the source; never overwrite.' : 'Grow the PhotoCraft document canvas and add the selected generated area as a layer, as one undo step.';
}
async function xRun() {
  if (X.running || busy || !X.img) return;
  const [a, b] = xRatio(); X.res = xMargins();
  try { await api('/api/run', {ratio:X.free ? null : [a, b], x:X.fx, y:X.fy, w:X.fw, h:fH(), prompt:$('xPrompt').value.trim(), variations}); }
  catch (e) { setStatus(e.message, true); return; }
  X.running = true; X.hasResult = false; xClearTabs(); xTab('frame'); xRunMode(true); busy = true; xButtons();
  X.poll = setInterval(xPoll, 600); xPoll();
}
async function xPoll() {
  if (X.polling) return;
  X.polling = true;
  let j; try { j = await api('/api/job', {}); } catch (e) { return; } finally { X.polling = false; }
  const first = !X.vars.length && j.count > 0;
  xMakeTabs(j.count);
  if (first) xPick(j.selected || 0, false);
  if (j.state === 'running') { setStatus(`Generating ${Math.round(j.fraction*100)}%${j.text ? ': ' + j.text : ''}`); $('status').classList.add('busy'); return; }
  clearInterval(X.poll); X.running = false; busy = false; xRunMode(false); xInfo();
  if (j.state === 'done') {
    setStatus(`Done. ${j.count} result(s) available.`, false, true);
  } else { setStatus(j.message || j.state, j.state === 'error'); xRefresh(false); }
}
function xRunMode(running) {
  const b = $('xRun'); b.classList.toggle('cancel', running); b.textContent = running ? 'Cancel' : 'Generate'; b.disabled = false;
  b.title = running ? 'Stop the generation.' : 'Generate the new area with ComfyUI. The picture itself is not changed.';
}
$('xRun').onclick = async () => {
  if (!X.running) return xRun();
  $('xRun').disabled = true; try { await api('/api/cancel', {}); } catch (e) { setStatus(e.message, true); $('xRun').disabled = false; }
};
$('xGet').onclick = xGet;
async function xSend() {
  if (X.running || busy || !X.hasResult) return;
  xTransferBusy(true); setStatus(X.sourceKind === 'local' ? 'Saving selected result beside source...' : 'Sending the expanded canvas to PhotoCraft...');
  try {
    const r = await api('/api/send-result', {seq:X.seq});
    setBusy(false);
    setStatus(r.saved ? `Saved result: ${r.path}` : `Sent: canvas ${r.width} \u00d7 ${r.height} and layer added to ${r.document}.`, false, true);
  } catch (e) { setStatus(e.message, true); }
  finally { xTransferBusy(false); }
}
$('xSend').onclick = xSend;
async function xFreeMemory() {
  if (X.running || busy || X.settingsSaving) return;
  setBusy(true); xButtons(); xInfo(); setStatus('Requesting memory release...');
  try {
    const r = await api('/api/comfy/free', {});
    if (!r.requested) throw new Error('Memory release was not acknowledged.');
    setBusy(false); setStatus('Memory release requested', false, true);
  } catch (e) { setStatus(e.message, true); }
  finally { setBusy(false); xButtons(); xInfo(); }
}
$('xFreeMemory').onclick = xFreeMemory;
$('xFiles').onchange = async () => {
  const p = $('xFiles').value; if (!p || X.running || busy) return;
  xTransferBusy(true); setStatus('Loading...');
  try { xLoaded(await api('/api/load', {path:p})); } catch (e) { setStatus(e.message, true); }
  xTransferBusy(false);
};
async function loadList() {
  const list = await api('/api/images'); if (!list.length) return;
  const sel = $('xFiles'); sel.hidden = false;
  sel.append(new Option('Open a picture...', ''));
  list.forEach(f => sel.append(new Option(f.name, f.path)));
}

const SETKEYS = ['guidance','steps','megapixels','feathering','unet','upscale','lora','seam_correction'];
const FILLKEYS = ['guidance','steps','megapixels','feathering','unet','upscale'];
let savedSettings = {};
const isFill = () => $('smethod').value === 'flux1_fill';
const settingKey = k => isFill() && FILLKEYS.includes(k) ? 'fill_' + k : k;
const SL = {};
function slider(parent, key, label, min, max, step, tip) {
  const row = document.createElement('div'); row.className = 'row';
  const lab = document.createElement('label'); lab.textContent = label; lab.title = tip; lab.style.cursor = 'help'; lab.htmlFor = 's' + key;
  const rng = document.createElement('input'); rng.type = 'range'; rng.id = 's' + key; rng.min = min; rng.max = max; rng.step = step;
  const num = document.createElement('input'); num.type = 'text'; num.readOnly = true; num.tabIndex = -1; num.className = 'val';
  rng.addEventListener('input', () => { num.value = rng.value; if (typeof updateStar === 'function') updateStar(); });
  row.append(lab, rng, num); parent.append(row);
  SL[key] = v => { rng.value = v; num.value = rng.value; };
}
(function buildAdvanced() {
  const root = $('xAdv');
  root.insertAdjacentHTML('beforeend', `<div class="row model-row"><label for="smethod">method</label><select id="smethod" style="flex:1"><option value="flux2">FLUX.2</option><option value="flux1_fill">FLUX.1 Fill</option></select></div>`);
  slider(root, 'guidance', 'guidance', 1, 10, 0.5, 'Prompt strength. Higher is more contrasty and saturated.');
  slider(root, 'steps', 'steps', 1, 50, 1, 'Sampling steps: 8 with the Turbo LoRA, about 20 without.');
  slider(root, 'megapixels', 'megapixels', 0.25, 2, 0.25, 'Size the AI works at (the result is upscaled afterwards). Smaller is faster and often cleaner.');
  slider(root, 'feathering', 'feather px', 0, 512, 8, 'How far the original fades into the new area at the seam.');
  root.insertAdjacentHTML('beforeend', `
    <div class="row toggle-row"><label for="slora">turbo lora</label><input type="checkbox" id="slora" role="switch"></div>
    <div class="row toggle-row"><label for="sseam_correction">seam colour correction</label><input type="checkbox" id="sseam_correction"></div>
    <div class="row model-row"><label for="sunet" id="sunetLabel" title="GGUF diffusion model." style="cursor:help">model</label><select id="sunet" style="flex:1"></select></div>
    <div class="row model-row"><label for="supscale" id="supscaleLabel" title="Upscale model for the generated area." style="cursor:help">upscaler</label><select id="supscale" style="flex:1"></select></div>
    <div class="row model-row" id="fillDeviceRow" hidden><label for="sfill_clip_device" title="Default lets ComfyUI choose GPU/offloading according to available memory. CPU uses less VRAM." style="cursor:help">text encoding</label><select id="sfill_clip_device" style="flex:1"><option value="cpu">CPU</option><option value="default">Default (GPU / auto)</option></select></div>`);
  const firstSlider = root.querySelector('input[type="range"]').closest('.row');
  root.querySelectorAll('.model-row').forEach(row => root.insertBefore(row, firstSlider));
})();
function fillSelect(id, options, value) {
  const sel = $(id); sel.innerHTML = '';
  const all = options.includes(value) || !value ? options : [value, ...options];
  all.forEach(o => sel.append(new Option(o, o))); sel.value = value;
}
function showSettings(v) {
  savedSettings = {...v};
  $('smethod').value = v.method || 'flux2';
  const fill = isFill();
  $('sguidance').max = fill ? 100 : 10;
  $('sguidance').step = fill ? 1 : 0.5;
  $('ssteps').closest('.row').querySelector('label').title = fill ? 'Native Fill sampling steps (default 28).' : 'Sampling steps: 8 with the Turbo LoRA, about 20 without.';
  $('sunetLabel').title = fill ? 'Full FLUX.1 Fill safetensors weights, loaded FP8. Not FLUX dev, Kontext or Nunchaku.' : 'GGUF diffusion model.';
  ['lora','seam_correction'].forEach(k => { $('s' + k).closest('.row').hidden = fill; });
  $('supscaleLabel').title = 'Lanczos only, or a neural upscale model followed by exact-size Lanczos resizing. Neural upscale uses additional time and VRAM.';
  $('fillDeviceRow').hidden = !fill;
  $('sfill_clip_device').value = v.fill_clip_device || 'cpu';
  SETKEYS.forEach(k => {
    const e = $('s' + k), value = v[settingKey(k)];
    if (e.type === 'checkbox') e.checked = !!value;
    else if (SL[k]) SL[k](value);
  });
}
let statusRetry = null;
let statusRequest = 0;
async function loadStatus() {
  clearTimeout(statusRetry);
  const request = ++statusRequest;
  let r;
  try { r = await api('/api/status', {}); } catch (e) {
    if (request !== statusRequest) return;
    X.ready = false; setStatus(e.message, true); xInfo(); return;
  }
  if (request !== statusRequest) return;
  showSettings(r.settings);
  fillSelect('sunet', r.unets, r.settings[settingKey('unet')]);
  fillSelect('supscale', ['lanczos', ...r.upscalers], r.settings[settingKey('upscale')]);
  $('supscale').querySelector('option[value="lanczos"]').textContent = 'Lanczos (no model)';
  X.ready = r.ok;
  if (!X.running) $('xRun').title = r.message || 'Generate the new area with ComfyUI. The picture itself is not changed.';
  if (r.reachable === false) {
    statusRetry = setTimeout(() => { if (!X.running) loadStatus(); }, 2000);
  } else if (r.message) {
    setStatus(r.message, true);
  }
  xInfo();
}
async function saveSettings(values) {
  ++statusRequest; X.settingsSaving = true; X.ready = false; xInfo();
  try { await api('/api/settings', {values}); setStatus('Settings saved', false, true); }
  catch (e) { setStatus(e.message, true); }
  await loadStatus(); X.settingsSaving = false; xInfo(); updateStar();
}
SETKEYS.forEach(k => { const e = $('s' + k); e.onchange = () => saveSettings({[settingKey(k)]: e.type === 'checkbox' ? e.checked : e.value}); });
$('smethod').onchange = () => saveSettings({method: $('smethod').value});
$('sfill_clip_device').onchange = () => saveSettings({fill_clip_device: $('sfill_clip_device').value});

/* ---------- presets ---------- */
const presets = {presets: {}, last: null};
let presetSnap = '';
const curSettings = () => {
  const o = {...savedSettings, method: $('smethod').value};
  if (isFill()) o.fill_clip_device = $('sfill_clip_device').value;
  SETKEYS.filter(k => !isFill() || FILLKEYS.includes(k)).forEach(k => {
    const e = $('s' + k);
    o[settingKey(k)] = e.type === 'checkbox' ? e.checked : (e.tagName === 'SELECT' || isNaN(+e.value) ? e.value : +e.value);
  });
  return JSON.stringify(o);
};
function updateStar() {
  const o = $('presetSel').selectedOptions[0]; if (!o) return;
  o.textContent = o.dataset.label + (curSettings() !== presetSnap ? ' *' : '');
}
function presetButtons() { const v = $('presetSel').value; $('presetSave').disabled = v === 'builtin'; $('presetRemove').disabled = v === 'builtin'; }
function fillPresetList() {
  const sel = $('presetSel'); sel.innerHTML = '';
  const add = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = o.dataset.label = t; sel.append(o); };
  add('builtin', 'Factory settings');
  Object.keys(presets.presets).sort().forEach(n => add('p:' + n, n));
  sel.value = presets.last ? 'p:' + presets.last : 'builtin';
  presetButtons();
}
const presetSnapNow = () => { presetSnap = curSettings(); updateStar(); };
async function presetCall(path, body) {
  try { Object.assign(presets, await api(path, body)); fillPresetList(); await loadStatus(); presetSnapNow(); }
  catch (e) { setStatus(e.message, true); }
}
async function loadPresets() {
  try { Object.assign(presets, await api('/api/presets', {})); } catch (e) { setStatus(e.message, true); }
  fillPresetList(); await loadStatus(); presetSnapNow();
}
$('presetSel').onchange = () => { const v = $('presetSel').value; presetCall('/api/presets/load', {name: v === 'builtin' ? null : v.slice(2)}); };
$('presetSave').onclick = () => { const v = $('presetSel').value; if (v !== 'builtin') presetCall('/api/presets/save', {name: v.slice(2)}); };
$('presetNew').onclick = () => {
  const name = (prompt('Name for the new preset:') || '').trim(); if (!name) return;
  if (name in presets.presets && !confirm(`A preset named "${name}" exists. Overwrite it?`)) return;
  presetCall('/api/presets/save', {name});
};
$('presetRemove').onclick = () => {
  const v = $('presetSel').value; if (v === 'builtin' || !confirm(`Delete the preset "${v.slice(2)}"?`)) return;
  presetCall('/api/presets/delete', {name: v.slice(2)});
};
window.addEventListener('focus', () => { if (!X.running && !X.settingsSaving) loadStatus().then(updateStar); });
if (localStorage.getItem('shpx-land') === '0') X.land = false;
xButtons(); xSyncSize(); xInfo(); xDraw();
loadList().catch(e => setStatus(e.message, true)); loadPresets();
</script>
