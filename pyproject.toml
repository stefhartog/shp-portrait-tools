[project]
name = "shp-portrait-tools"
version = "0.1.0"
description = "SHP Portrait Tools: local Skin Tools retouching with PhotoCraft and Photoshop transfer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "opencv-contrib-python>=4.10",
    "onnxruntime-gpu>=1.31.1",
    "rtmlib>=0.0.16",
    "pywebview>=5.4; sys_platform == 'win32'",
    "pystray>=0.19.5; sys_platform == 'win32'",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas>=13.8.2.12",
    "nvidia-cuda-runtime>=13.4.92",
    "nvidia-cudnn-cu13>=9.27.0.42",
    "nvidia-cufft>=12.4.0.43",
    "nvidia-curand>=10.4.4.72",
]
research = ["matplotlib>=3.11.2", "jupyter>=1.1.1"]

[project.scripts]
shp-portrait-tools = "shp_portrait_tools.launcher:main"
shp-skin-tools = "shp_portrait_tools.modules.dnb.ui_server:main"
# Old command names, kept for one release; remove after the next tagged release.
shp-photocraft-tools = "shp_portrait_tools.launcher:main"
shp-photocraft-dnb = "shp_portrait_tools.modules.dnb.ui_server:main"
shpdnb = "shp_portrait_tools.modules.dnb.ui_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shp_portrait_tools"]

[tool.uv]
# rtmlib also requires the non-contrib wheel, which overwrites the shared cv2 module.
override-dependencies = [
    "onnxruntime; sys_platform == 'never'",
    "opencv-python; sys_platform == 'never'",
]
required-environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]
